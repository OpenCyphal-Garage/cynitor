<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyCyphal Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.4.0/dist/css/tabulator_midnight.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">

    <!-- ── Sidebar ── -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <span>PyCyphal</span>
        <span class="theme-label" id="themeLabel">Black</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme"></button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-group-header">
          <div class="sidebar-group-label">
            <span class="semaphore" id="serverSemaphore"></span>
            Server
          </div>
          <span class="throughput-value hidden" id="serverThroughput"></span>
        </div>
        <div class="sidebar-connect">
          <input id="apiBase" type="text" value="http://localhost:8080" placeholder="http://localhost:8080" />
          <button id="connectDashboardBtn" class="sidebar-action btn-primary">Connect</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-group-header">
          <div class="sidebar-group-label">
            <span class="semaphore" id="canSemaphore"></span>
            CAN
          </div>
          <span class="throughput-value hidden" id="canUtilization"></span>
        </div>
        <div class="sidebar-connect">
          <select id="interfacesSelect"></select>
          <button id="connectCanBtn" class="sidebar-action btn-primary">Connect</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-group-header">
          <div class="sidebar-group-label">Refresh</div>
          <span class="throughput-value" id="refreshValue">3s</span>
        </div>
        <input id="nodesRefreshSlider" type="range" min="1" max="60" value="3" />
      </div>

      <div class="sidebar-bottom">
        <div class="sidebar-node-count">
          <span class="label">Nodes</span>
          <span id="nodeCount" class="node-count-value">0</span>
        </div>
        <div class="sidebar-node-count">
          <span class="label">Events</span>
          <span id="eventCount" class="node-count-value">0</span>
        </div>
      </div>
    </nav>

    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Toggle sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- ── Main: Nodes table + detail panel ── -->
    <div class="main-area">
      <div id="nodesTable"></div>
      <div class="detail-resize-handle" id="detailResizeHandle">
        <button class="detail-collapse-btn" id="detailCollapseBtn" aria-label="Toggle detail panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>
      <div class="detail-panel" id="detailPanel">
        <div class="detail-tabs">
          <button class="detail-tab active" data-tab="publishers">Publishers</button>
          <button class="detail-tab" data-tab="subscribers">Subscribers</button>
          <button class="detail-tab" data-tab="servers">Servers</button>
          <button class="detail-tab" data-tab="clients">Clients</button>
          <button class="detail-tab" data-tab="registers">Registers</button>
        </div>
        <div class="detail-panel-content" id="selectedNodeContent">
          <div class="detail-empty">Select a node to inspect details.</div>
        </div>
      </div>
    </div>

  </div><!-- /app-shell -->

  <div id="serverDownOverlay" class="server-down-overlay hidden">
    <div class="server-down-card">
      <div class="server-down-icon">!</div>
      <h2>Frontend Server Unavailable</h2>
      <p>The web server at <code>localhost:5500</code> is not responding.</p>
      <p class="server-down-hint">Start it with: <code>cd website && python3 -m http.server 5500</code></p>
      <div class="server-down-status">Reconnecting<span class="server-down-dots"></span></div>
    </div>
  </div>

  <!-- Hidden elements referenced by JS (preserved for future use) -->
  <div class="hidden">
    <div id="wsStatus" class="status status-unknown">Disconnected</div>
    <div id="wsReconnectStatus">idle</div>
    <div id="healthStatus" class="status status-unknown">Unknown</div>
    <button id="connectWsBtn"></button>
    <input id="filterSubjects" type="text" />
    <input id="filterNodes" type="text" />
    <input id="filterTypes" type="text" />
    <button id="applyFilterBtn"></button>
    <input id="nodesRefreshSeconds" type="number" value="3" />
    <button id="applyNodesRefreshBtn"></button>
    <button id="detailTabInfo" class="tab-btn active" data-tab="info"></button>
    <button id="selectInterfaceBtn"></button>
    <button id="checkHealthBtn"></button>
    <button id="getNodesBtn"></button>
    <input id="subjectIdInput" type="number" />
    <button id="getSubjectBtn"></button>
    <input id="nodeIdInput" type="number" />
    <button id="getNodeBtn"></button>
    <pre id="startupResult" class="output"></pre>
    <pre id="restOutput" class="output"></pre>
    <input id="logsLimit" type="number" value="100" />
    <select id="logsLevel"><option value="">Any</option></select>
    <select id="logsMinLevel"><option value="">Any</option></select>
    <button id="getLogsBtn"></button>
    <tbody id="logsBody"></tbody>
    <tbody id="eventsBody"></tbody>
    <span id="advancedCapabilityStatus"></span>
    <button id="refreshCapabilitiesBtn"></button>
    <fieldset id="registerActionFieldset">
      <input id="registerNodeUniqueIdInput" type="text" />
      <input id="registerNameInput" type="text" />
      <input id="registerTypeInput" type="text" />
      <input id="registerValueInput" type="text" />
      <button id="setRegisterBtn"></button>
    </fieldset>
    <fieldset id="serviceActionFieldset">
      <input id="serviceNodeIdInput" type="number" />
      <input id="serviceUniqueIdInput" type="text" />
      <input id="serviceIdInput" type="number" />
      <input id="serviceTypeInput" type="text" />
      <input id="serviceAttributesInput" type="text" />
      <button id="sendServiceRequestBtn"></button>
    </fieldset>
    <pre id="advancedActionsOutput"></pre>
    <svg id="networkGraph"></svg>
    <div id="graphEmptyState"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://unpkg.com/tabulator-tables@6.4.0/dist/js/tabulator.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
