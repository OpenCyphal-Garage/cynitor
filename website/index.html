<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cynitor</title>
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.4.0/dist/css/tabulator_midnight.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">

    <!-- ── Sidebar ── -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <span id="brandName">Cynitor</span>
        <span class="theme-label" id="themeLabel">Light</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme"></button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-group-header">
          <div class="sidebar-group-label">
            <span class="semaphore" id="serverSemaphore"></span>
            Server
          </div>
          <span class="throughput-value hidden" id="serverThroughput"></span>
        </div>
        <div class="sidebar-connect">
          <input id="apiBase" type="text" value="http://localhost:8080" placeholder="http://localhost:8080" />
          <button id="connectDashboardBtn" class="sidebar-action btn-primary">Connect</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-group-header">
          <div class="sidebar-group-label">
            <span class="semaphore" id="canSemaphore"></span>
            <span id="canLabel" class="easter-trigger">CAN</span>
          </div>
          <span class="throughput-value hidden" id="canUtilization"></span>
        </div>
        <div class="sidebar-connect">
          <div class="sparkline-wrap">
            <select id="interfacesSelect"></select>
            <canvas id="busLoadSparkline" class="bus-load-sparkline hidden"></canvas>
            <div id="busFullEaster" class="bus-full-easter hidden">
              <img src="./images/easter_bus_2.gif" alt="" />
              <span>Bus occupancy:<br/>standing room only</span>
            </div>
          </div>
          <button id="connectCanBtn" class="sidebar-action btn-primary">Connect</button>
        </div>
      </div>

      <div class="sidebar-view-tabs" role="tablist">
        <div class="view-segmented">
          <button class="view-seg-btn active" data-view="nodes" role="tab" aria-selected="true" id="viewTabNodes" aria-controls="nodesTable">Nodes</button>
          <button class="view-seg-btn" data-view="subjects" role="tab" aria-selected="false" id="viewTabSubjects" aria-controls="subjectsTable">Subjects</button>
          <div class="view-seg-indicator"></div>
        </div>
        <button class="view-graph-btn" data-view="graph" role="tab" aria-selected="false" id="viewTabGraph" aria-controls="graphContainer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/>
            <line x1="8.5" y1="7.5" x2="10.5" y2="16"/><line x1="15.5" y1="7.5" x2="13.5" y2="16"/>
          </svg>
          <span>Graph</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="footer-left">
          <span class="version-tag">v0.2.2</span>
          <a class="sidebar-built-by" href="https://cordicor.com" target="_blank" rel="noopener">
            <img src="./images/cordicor_minimal.svg" alt="Cordicor" class="cordicor-logo" />
            <span class="built-by-label">Built by</span>
            <span class="built-by-name">Cordicor</span>
          </a>
        </div>
        <div class="footer-right">
          <span class="powered-by-label">Powered by</span>
          <a href="https://opencyphal.org/" target="_blank" rel="noopener">
            <img src="./images/cyphal_logo2.png" alt="Cyphal" class="cyphal-logo" />
          </a>
        </div>
      </div>

    </nav>

    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Toggle sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- ── Main: Nodes table + detail panel ── -->
    <main class="main-area">
      <div id="nodesTable" role="tabpanel" aria-labelledby="viewTabNodes"></div>
      <div id="subjectsTable" class="hidden" role="tabpanel" aria-labelledby="viewTabSubjects"></div>
      <div id="graphContainer" class="hidden" role="tabpanel" aria-labelledby="viewTabGraph"></div>
      <div class="detail-resize-handle" id="detailResizeHandle">
        <button class="detail-collapse-btn" id="detailCollapseBtn" aria-label="Toggle detail panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>
      <div class="detail-panel" id="detailPanel">
        <div class="detail-tabs" role="tablist">
          <button class="detail-tab active" data-tab="publishers" role="tab" aria-selected="true">Publishers</button>
          <button class="detail-tab" data-tab="subscribers" role="tab" aria-selected="false">Subscribers</button>
          <button class="detail-tab" data-tab="servers" role="tab" aria-selected="false">Servers</button>
          <button class="detail-tab" data-tab="clients" role="tab" aria-selected="false">Clients</button>
          <button class="detail-tab" data-tab="registers" role="tab" aria-selected="false">Registers</button>
          <button class="detail-tab" data-tab="history" role="tab" aria-selected="false">History</button>
        </div>
        <div class="detail-panel-content" id="selectedNodeContent" role="tabpanel">
          <div class="detail-empty">Select a node to inspect details.</div>
        </div>
      </div>
    </main>

  </div><!-- /app-shell -->

  <div id="toastContainer" class="toast-container"></div>

  <div id="easterEggOverlay" class="easter-overlay hidden">
    <img src="./images/easter_bus_1.gif" alt="" />
  </div>

  <div id="serverDownOverlay" class="server-down-overlay hidden">
    <div class="server-down-card">
      <div class="server-down-icon">!</div>
      <h2>Frontend Server Unavailable</h2>
      <p>The web server at <code>localhost:5500</code> is not responding.</p>
      <p class="server-down-hint">Start it with: <code>cd website && python3 -m http.server 5500</code></p>
      <div class="server-down-status">Reconnecting<span class="server-down-dots"></span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://unpkg.com/tabulator-tables@6.4.0/dist/js/tabulator.min.js"></script>
  <script src="./state.js"></script>
  <script src="./cache.js"></script>
  <script src="./services-panel.js"></script>
  <script src="./registers-panel.js"></script>
  <script src="./history-panel.js"></script>
  <script src="./plot.js"></script>
  <script src="./detail-panel.js"></script>
  <script src="./nodes-table.js"></script>
  <script src="./subjects-panel.js"></script>
  <script src="./graph-view.js"></script>
  <script src="./connection.js"></script>
  <script src="./app.js"></script>
</body>
</html>
