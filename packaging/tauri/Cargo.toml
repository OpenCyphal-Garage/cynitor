[package]
name = "cynitor"
# Single source of truth for the release version. tauri.conf.json omits
# `version` so Tauri reads it from here, and the desktop workflow refuses to
# build a tag that disagrees with it.
version = "0.5.2"
description = "Cyphal network monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# v2 links webkit2gtk-4.1, which Ubuntu 22.04 and 24.04 both provide. v1
# needed 4.0, which 24.04 dropped, so a .deb built against it would not
# install there.
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"

[features]
# Release builds embed the frontend instead of expecting a dev server. Our
# config declares no devUrl, so assets would embed either way, but this keeps
# the intent explicit and matches what the CLI expects of a release build.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
