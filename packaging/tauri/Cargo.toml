[package]
name = "cynitor"
# Single source of truth for the release version. tauri.conf.json omits
# `package.version` so Tauri reads it from here, and the desktop workflow
# refuses to build a tag that disagrees with it.
version = "0.1.0"
description = "Cyphal network monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-sidecar"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
