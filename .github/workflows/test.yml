name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        # The test suite mocks the Cyphal stack, so it needs neither the DSDL
        # submodule nor compiled types. Skipping the submodule keeps this fast.

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt

      - name: Run test suite
        working-directory: server
        env:
          # Matches the documented local command: stops third-party plugins
          # (notably ROS2's) from being auto-loaded into the run.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/ -v -p pytest_asyncio.plugin

  e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install Playwright
        run: pip install -r tests/e2e/requirements.txt

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the pinned Playwright version: each release expects a
          # specific Chromium build, so a version bump must miss the cache.
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Chromium system dependencies
        # apt packages are not cacheable; this is the smaller half.
        run: playwright install-deps chromium

      - name: Run end-to-end tests
        # The script serves website/ itself and shuts the server down after,
        # so this is one step with no background process crossing a boundary.
        working-directory: tests/e2e
        run: python3 test_landing_page.py

      - name: Upload result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-result
          path: tests/e2e/result.md
          if-no-files-found: ignore
