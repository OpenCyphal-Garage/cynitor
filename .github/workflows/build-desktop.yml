name: Desktop Build

on:
  push:
    tags: ['v*']
    # TEMPORARY, this branch only: proves the vcan smoke test on a
    # runner before a release depends on it. Delete the branch after.
    branches: [ci-smoke-dryrun]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux installers
    # Pinned deliberately, not a leftover. Tauri v1 links against
    # webkit2gtk-4.0, which Ubuntu 24.04 (what ubuntu-latest now resolves to)
    # no longer packages; it ships 4.1 only. Moving to ubuntu-latest requires
    # migrating to Tauri v2 first.
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # attach installers to the Release on a tag build

    steps:
      - uses: actions/checkout@v7
        with:
          # public_regulated_data_types supplies the uavcan/ and reg/ trees the
          # DSDL compile step reads.
          submodules: recursive

      - name: Check the tag matches the declared version
        # Installers are named from packaging/tauri/Cargo.toml, so a tag that
        # disagrees would attach e.g. cynitor_0.1.0_amd64.deb to a v0.2.0
        # release. Fail before spending ten minutes building the wrong thing.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(grep -m1 '^version' packaging/tauri/Cargo.toml | cut -d'"' -f2)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in packaging/tauri/Cargo.toml ($declared)."
            echo "Bump that version, commit, delete the tag, and re-tag."
            exit 1
          fi
          echo "Version $declared matches tag $GITHUB_REF_NAME"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Install Python build dependencies
        run: pip install -r server/requirements.txt pyinstaller

      - name: Cache cargo registry and tools
        # Deliberately excludes packaging/tauri/target: it reached 4.2 GB
        # locally, which is slow to save and restore and crowds out the repo's
        # 10 GB cache budget. Caching ~/.cargo/bin is the big win here, since it
        # turns the Tauri CLI install below into a no-op.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('packaging/tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Tauri CLI
        # Restored from cache on subsequent runs; the guard keeps this a no-op.
        run: |
          if ! cargo tauri --version >/dev/null 2>&1; then
            cargo install tauri-cli --locked --version '^1.6'
          fi

      - name: Compile DSDL
        # python_compiled_messages/ is gitignored and the frozen binary cannot
        # regenerate it (nnvg is not bundled), so it must exist before
        # PyInstaller runs. The spec refuses to build without it.
        working-directory: server
        run: python startup_setup.py --recompile

      - name: Build installers
        working-directory: packaging
        run: ./build.sh release

      - name: Smoke-test the packaged backend
        # Two packaging bugs shipped in a row because every check we had passed:
        # the binary started, served the dashboard and answered read-only
        # endpoints, yet could not reach a bus. Both were modules missing from
        # the bundle (pydsdl's vendored parser, then python-can), and both only
        # surface when the CAN stack is imported, which happens on connect.
        #
        # Direct-attach mode reaches those imports before it touches any
        # device, so pointing it at an interface that does not exist exercises
        # the whole chain. That avoids needing vcan, which Azure runner kernels
        # do not ship: "Module vcan not found in /lib/modules/*-azure".
        run: |
          set -euo pipefail

          log=$(mktemp)
          packaging/dist/cynitor-server --can nosuchcan0 >"$log" 2>&1 || true

          if grep -q "No module named" "$log"; then
            echo "::error::packaged backend is missing a bundled module"
            grep -m3 "No module named" "$log"
            exit 1
          fi

          # It must fail on the absent device, which proves it got all the way
          # through the imports rather than falling over somewhere earlier.
          grep -qiE "No such device|Could not access SocketCAN" "$log" || {
            echo "::error::backend never reached the CAN device layer"
            tail -40 "$log"
            exit 1
          }
          echo "CAN stack imports cleanly inside the bundle"

          # And the dashboard has to come out of the bundle too.
          TOKEN=smoke-test-token
          CYNITOR_AUTH_TOKEN="$TOKEN" packaging/dist/cynitor-server &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          curl --retry 60 --retry-delay 1 --retry-connrefused -sf -o /dev/null \
            http://127.0.0.1:8080/api/health

          page=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          test "$page" = "200" || { echo "::error::dashboard not served (HTTP $page)"; exit 1; }

          api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/status)
          test "$api" = "401" || { echo "::error::API not protected (HTTP $api)"; exit 1; }
          echo "dashboard served from the bundle, API still requires a token"

      - uses: actions/upload-artifact@v7
        with:
          name: cynitor-linux-installers
          path: |
            packaging/tauri/target/release/bundle/deb/*.deb
            packaging/tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            packaging/tauri/target/release/bundle/deb/*.deb \
            packaging/tauri/target/release/bundle/appimage/*.AppImage \
            --clobber
