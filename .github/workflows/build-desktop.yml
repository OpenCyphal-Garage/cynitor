name: Desktop Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux installers
    # Pinned deliberately, not a leftover. Tauri v1 links against
    # webkit2gtk-4.0, which Ubuntu 24.04 (what ubuntu-latest now resolves to)
    # no longer packages; it ships 4.1 only. Moving to ubuntu-latest requires
    # migrating to Tauri v2 first.
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # attach installers to the Release on a tag build

    steps:
      - uses: actions/checkout@v4
        with:
          # public_regulated_data_types supplies the uavcan/ and reg/ trees the
          # DSDL compile step reads.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Install Python build dependencies
        run: pip install -r server/requirements.txt pyinstaller

      - name: Cache cargo registry and tools
        # Deliberately excludes packaging/tauri/target: it reached 4.2 GB
        # locally, which is slow to save and restore and crowds out the repo's
        # 10 GB cache budget. Caching ~/.cargo/bin is the big win here, since it
        # turns the Tauri CLI install below into a no-op.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('packaging/tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Tauri CLI
        # Restored from cache on subsequent runs; the guard keeps this a no-op.
        run: |
          if ! cargo tauri --version >/dev/null 2>&1; then
            cargo install tauri-cli --locked --version '^1.6'
          fi

      - name: Compile DSDL
        # python_compiled_messages/ is gitignored and the frozen binary cannot
        # regenerate it (nnvg is not bundled), so it must exist before
        # PyInstaller runs. The spec refuses to build without it.
        working-directory: server
        run: python startup_setup.py --recompile

      - name: Build installers
        working-directory: packaging
        run: ./build.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: cynitor-linux-installers
          path: |
            packaging/tauri/target/release/bundle/deb/*.deb
            packaging/tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            packaging/tauri/target/release/bundle/deb/*.deb \
            packaging/tauri/target/release/bundle/appimage/*.AppImage \
            --clobber
