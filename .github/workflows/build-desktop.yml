name: Desktop Build

on:
  push:
    tags: ['v*']
    # TEMPORARY, this branch only: proves the vcan smoke test on a
    # runner before a release depends on it. Delete the branch after.
    branches: [ci-smoke-dryrun]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux installers
    # Pinned deliberately, not a leftover. Tauri v1 links against
    # webkit2gtk-4.0, which Ubuntu 24.04 (what ubuntu-latest now resolves to)
    # no longer packages; it ships 4.1 only. Moving to ubuntu-latest requires
    # migrating to Tauri v2 first.
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # attach installers to the Release on a tag build

    steps:
      - uses: actions/checkout@v7
        with:
          # public_regulated_data_types supplies the uavcan/ and reg/ trees the
          # DSDL compile step reads.
          submodules: recursive

      - name: Check the tag matches the declared version
        # Installers are named from packaging/tauri/Cargo.toml, so a tag that
        # disagrees would attach e.g. cynitor_0.1.0_amd64.deb to a v0.2.0
        # release. Fail before spending ten minutes building the wrong thing.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(grep -m1 '^version' packaging/tauri/Cargo.toml | cut -d'"' -f2)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in packaging/tauri/Cargo.toml ($declared)."
            echo "Bump that version, commit, delete the tag, and re-tag."
            exit 1
          fi
          echo "Version $declared matches tag $GITHUB_REF_NAME"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Install Python build dependencies
        run: pip install -r server/requirements.txt pyinstaller

      - name: Cache cargo registry and tools
        # Deliberately excludes packaging/tauri/target: it reached 4.2 GB
        # locally, which is slow to save and restore and crowds out the repo's
        # 10 GB cache budget. Caching ~/.cargo/bin is the big win here, since it
        # turns the Tauri CLI install below into a no-op.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('packaging/tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Tauri CLI
        # Restored from cache on subsequent runs; the guard keeps this a no-op.
        run: |
          if ! cargo tauri --version >/dev/null 2>&1; then
            cargo install tauri-cli --locked --version '^1.6'
          fi

      - name: Compile DSDL
        # python_compiled_messages/ is gitignored and the frozen binary cannot
        # regenerate it (nnvg is not bundled), so it must exist before
        # PyInstaller runs. The spec refuses to build without it.
        working-directory: server
        run: python startup_setup.py --recompile

      - name: Build installers
        working-directory: packaging
        run: ./build.sh release

      - name: Smoke-test the packaged backend against a virtual CAN bus
        # The 0.5.0 installers started, served the dashboard and answered every
        # read-only endpoint, yet could not connect to a bus: a dependency
        # pydsdl vendors was missing from the bundle. Nothing caught it because
        # the failing import only happens on connect. Anything short of a real
        # connect would have shipped it again.
        run: |
          set -euo pipefail
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0

          TOKEN=smoke-test-token
          CYNITOR_AUTH_TOKEN="$TOKEN" packaging/dist/cynitor-server &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          curl --retry 60 --retry-delay 1 --retry-connrefused -sf -o /dev/null \
            http://127.0.0.1:8080/api/health
          echo "backend is up"

          auth=(-H "Authorization: Bearer $TOKEN")

          # The dashboard has to be served from inside the bundle.
          page=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          test "$page" = "200" || { echo "::error::dashboard not served (HTTP $page)"; exit 1; }

          # The one that matters: this is where the missing module surfaced.
          body=$(mktemp)
          code=$(curl -s -o "$body" -w '%{http_code}' -X POST \
            http://127.0.0.1:8080/api/can/connect "${auth[@]}" \
            -H 'Content-Type: application/json' -d '{"interface":"vcan0"}')
          cat "$body"; echo
          test "$code" = "200" || { echo "::error::packaged backend could not connect to vcan0"; exit 1; }

          # And it must still be attached a moment later, not crashed behind us.
          sleep 3
          curl -sf "${auth[@]}" http://127.0.0.1:8080/api/status \
            | grep -q '"can_interface": *"vcan0"' \
            || { echo "::error::backend did not stay attached to vcan0"; exit 1; }
          echo "packaged backend connected to vcan0 and stayed attached"

      - uses: actions/upload-artifact@v7
        with:
          name: cynitor-linux-installers
          path: |
            packaging/tauri/target/release/bundle/deb/*.deb
            packaging/tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            packaging/tauri/target/release/bundle/deb/*.deb \
            packaging/tauri/target/release/bundle/appimage/*.AppImage \
            --clobber
