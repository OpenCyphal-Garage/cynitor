name: Server Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux binary
    # Built on the oldest supported release on purpose: glibc is forward
    # compatible, so a binary built here runs on newer distributions, but not
    # the other way round.
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # attach the binary to the Release on a tag build

    steps:
      - uses: actions/checkout@v7
        with:
          # public_regulated_data_types supplies the uavcan/ and reg/ trees the
          # DSDL compile step reads.
          submodules: recursive

      - name: Check the tag matches the declared version
        # The binary is named from server/version.py, so a tag that disagrees
        # would publish a mismatched artifact. Fail before building.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(grep -m1 '^__version__' server/version.py | cut -d'"' -f2)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match server/version.py ($declared)."
            echo "Bump that version, commit, delete the tag, and re-tag."
            exit 1
          fi
          echo "Version $declared matches tag $GITHUB_REF_NAME"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install build dependencies
        run: pip install -r server/requirements.txt pyinstaller

      - name: Compile DSDL
        # python_compiled_messages/ is gitignored and the frozen binary cannot
        # regenerate it (nnvg is not bundled), so it must exist before
        # PyInstaller runs. The spec refuses to build without it.
        working-directory: server
        run: python startup_setup.py --recompile

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot

      - name: Build binary, .deb and .AppImage
        working-directory: packaging
        run: ./build.sh

      - name: Smoke-test the binary
        # Two packaging bugs shipped in a row because every check we had
        # passed: the binary started and served the dashboard, yet could not
        # reach a bus. Both were modules missing from the bundle, and both only
        # surface when the CAN stack is imported, which happens on connect.
        #
        # Direct-attach mode reaches those imports before touching any device,
        # so an interface that does not exist exercises the whole chain without
        # needing the vcan kernel module, which runner kernels do not ship.
        run: |
          set -euo pipefail

          # Since 0.7.1 a bad --can is survivable: the server warns and stays
          # up in selection mode, so this no longer exits on its own and has
          # to be run in the background and stopped.
          log=$(mktemp)
          packaging/dist/cynitor-server --can nosuchcan0 >"$log" 2>&1 &
          probe=$!
          curl --retry 60 --retry-delay 1 --retry-connrefused -sf -o /dev/null \
            http://127.0.0.1:8080/api/health
          # Give the attach attempt time to fail and log why.
          for _ in $(seq 1 30); do
            grep -qiE "No module named|Could not attach to" "$log" && break
            sleep 1
          done
          kill "$probe" 2>/dev/null || true
          wait "$probe" 2>/dev/null || true

          if grep -q "No module named" "$log"; then
            echo "::error::binary is missing a bundled module"
            grep -m3 "No module named" "$log"
            exit 1
          fi
          grep -qiE "Could not attach to|No such device|Could not access SocketCAN" "$log" || {
            echo "::error::binary never reached the CAN device layer"
            tail -40 "$log"
            exit 1
          }
          echo "CAN stack imports cleanly inside the bundle"

          TOKEN=smoke-test-token
          CYNITOR_AUTH_TOKEN="$TOKEN" packaging/dist/cynitor-server &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          curl --retry 60 --retry-delay 1 --retry-connrefused -sf -o /dev/null \
            http://127.0.0.1:8080/api/health

          page=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          test "$page" = "200" || { echo "::error::dashboard not served (HTTP $page)"; exit 1; }

          api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/status)
          test "$api" = "401" || { echo "::error::API not protected (HTTP $api)"; exit 1; }
          echo "dashboard served from the bundle, API still requires a token"

      - name: Collect artifacts
        run: |
          version=$(grep -m1 '^__version__' server/version.py | cut -d'"' -f2)
          cp packaging/dist/cynitor-server "packaging/out/cynitor-server-${version}-linux-x86_64"
          ls -lh packaging/out/

      - uses: actions/upload-artifact@v7
        with:
          name: cynitor-server-linux
          path: packaging/out/*
          if-no-files-found: error

      - name: Attach the binary to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Windows job may create the release first; losing that race is fine.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" packaging/out/* --clobber

  windows:
    name: Windows executable
    # The older of the two runner images. The executable does not depend on
    # the build machine's Windows version, and runs on Windows 10 and 11.
    runs-on: windows-2022
    permissions:
      contents: write  # attach the executable to the Release on a tag build

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          declared=$(grep -m1 '^__version__' server/version.py | cut -d'"' -f2)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match server/version.py ($declared)."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install build dependencies
        # On Windows, requirements.txt also brings gs_usb and libusb-package,
        # whose DLL the spec bundles for candleLight adapters.
        run: pip install -r server/requirements.txt pyinstaller

      - name: Compile DSDL
        working-directory: server
        run: python startup_setup.py --recompile

      - name: Build the executable
        working-directory: packaging
        run: python -m PyInstaller cynitor-server.spec --noconfirm

      - name: Smoke-test the executable
        # Imports and DLLs PyInstaller could not see only fail on connect, so
        # the test connects: to a gs_usb index no adapter has (libusb must
        # load for that answer), and through the CAN hub to a virtual bus. It
        # also checks the dashboard, the token, and that killing the
        # bootloader does not leave the server holding its port.
        shell: powershell
        run: ./packaging/smoke-test.ps1

      - name: Collect artifacts
        shell: bash
        run: |
          version=$(grep -m1 '^__version__' server/version.py | cut -d'"' -f2)
          mkdir -p packaging/out
          cp packaging/dist/cynitor-server.exe "packaging/out/cynitor-server-${version}-windows-x86_64.exe"
          ls -lh packaging/out/

      - uses: actions/upload-artifact@v7
        with:
          name: cynitor-server-windows
          path: packaging/out/*
          if-no-files-found: error

      - name: Attach the executable to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Linux job may create the release first; losing that race is fine.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" packaging/out/* --clobber
